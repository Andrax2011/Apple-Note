name: Build Notes APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Resources and Build APK
        run: |
          mkdir -p res/drawable res/values obj dex

          cat << 'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Заметки</string></resources>
          EOF

          cat << 'EOF' > res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFCC00" android:pathData="M0,0h108v34h-108z" />
              <path android:fillColor="#E5E5EA" android:pathData="M18,50h72v3h-72zM18,66h72v3h-72zM18,82h50v3h-50z" />
          </vector>
          EOF

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -f "$SDK/platforms/android-34/android.jar" ]; then
            ANDROID_JAR="$SDK/platforms/android-34/android.jar"
          elif [ -f "$SDK/platforms/android-35/android.jar" ]; then
            ANDROID_JAR="$SDK/platforms/android-35/android.jar"
          else
            ANDROID_JAR=$(ls -d "$SDK"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -d "$SDK/build-tools/34.0.0" ]; then
            BUILD_TOOLS="$SDK/build-tools/34.0.0"
          elif [ -d "$SDK/build-tools/35.0.0" ]; then
            BUILD_TOOLS="$SDK/build-tools/35.0.0"
          else
            BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          fi

          echo "Using $ANDROID_JAR and $BUILD_TOOLS"
          ls -la src/com/notes/app/

          "$BUILD_TOOLS/aapt2" compile --dir res -o res.zip
          "$BUILD_TOOLS/aapt2" link -o unsigned.apk -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml --min-sdk-version 26 --target-sdk-version 34 \
            --version-code 2 --version-name "1.1" res.zip

          javac -encoding UTF-8 -source 1.8 -target 1.8 -classpath "$ANDROID_JAR" \
            -d obj src/com/notes/app/*.java

          test -f obj/com/notes/app/MainActivity.class || { echo "ERROR: MainActivity.class missing!"; exit 1; }
          test -f obj/com/notes/app/EditorActivity.class || { echo "ERROR: EditorActivity.class missing!"; exit 1; }

          find obj -name "*.class" -print0 | xargs -0 "$BUILD_TOOLS/d8" \
            --min-api 26 --lib "$ANDROID_JAR" --output dex

          zip -j -0 unsigned.apk dex/classes.dex
          "$BUILD_TOOLS/zipalign" -f -p 4 unsigned.apk aligned.apk

          keytool -genkeypair -v -keystore notes.keystore -alias notes \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 \
            -dname "CN=Notes, OU=App, O=Notes, L=City, S=State, C=US"

          "$BUILD_TOOLS/apksigner" sign --ks notes.keystore --ks-key-alias notes \
            --ks-pass pass:123456 --key-pass pass:123456 --out Notes.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify Notes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notes-APK
          path: Notes.apk
          
